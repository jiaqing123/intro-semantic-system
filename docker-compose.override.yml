# ============================================================
# docker-compose.override.yml —— 本地开发覆盖
#
# 执行 docker compose up 时自动与 docker-compose.yml 合并（无需 -f 指定）。
# Visual Studio 容器工具在 F5 调试时还会在此基础上追加自动生成的调试配置
# （obj/Docker/docker-compose.vs.debug.g.yml），此文件无需包含调试细节。
# ============================================================
services:
  semanticsystemconsole:
    image: ${DOCKER_REGISTRY:-}semanticsystemconsole:dev
    build:
      args:
        BUILD_CONFIGURATION: Debug
    environment:
      DOTNET_ENVIRONMENT: Development

  tooldemo:
    image: ${DOCKER_REGISTRY:-}tooldemo:dev
    build:
      args:
        BUILD_CONFIGURATION: Debug
    environment:
      DOTNET_ENVIRONMENT: Development
    # 注意：不要在此设置 tty/stdin_open——会把终端转义序列混入 docker logs。
    # VS 调试所需的 tty 由 VS 自动生成的调试配置（obj/Docker/*.g.yml）提供。

